<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Import/Export Service</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .section {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
        }
        h2 {
            color: #61dafb;
        }
        button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #444;
        }
        pre {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
        .info {
            color: #60a5fa;
        }
        #fileInput {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Import/Export Service Test</h1>
    
    <div class="section">
        <h2>Setup Test Data</h2>
        <button onclick="setupTestData()">Setup Test Data</button>
        <button onclick="clearAllData()">Clear All Data</button>
        <div id="setupResult"></div>
    </div>
    
    <div class="section">
        <h2>Export Test</h2>
        <button onclick="testExport()">Test Export</button>
        <div id="exportResult"></div>
    </div>
    
    <div class="section">
        <h2>Import Test</h2>
        <input type="file" id="fileInput" accept=".json">
        <button onclick="testImport()">Test Import</button>
        <div id="importResult"></div>
    </div>
    
    <div class="section">
        <h2>Current Storage Status</h2>
        <button onclick="showStorageStatus()">Show Storage Status</button>
        <div id="storageStatus"></div>
    </div>

    <script type="module">
        import { ImportExportService } from './src/core/data/ImportExportService.js';
        import { SecureStorage } from './src/core/data/SecureStorage.js';
        import { TimerEntryRepository } from './src/core/data/TimerEntryRepository.js';
        
        // Initialize SecureStorage
        await SecureStorage.initialize();
        
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            const messageDiv = document.createElement('div');
            messageDiv.className = className;
            messageDiv.textContent = message;
            element.appendChild(messageDiv);
        }
        
        window.setupTestData = async function() {
            const result = document.getElementById('setupResult');
            result.textContent = '';
            
            try {
                // Create test data in both old and new formats
                const testDate = '2025-08-18';
                
                // Old format data
                const oldFormatData = {
                    timers: {
                        projectTraining: { startTime: null, totalSeconds: 1800 },
                        sheetwork: { startTime: null, totalSeconds: 3600 },
                        blocked: { startTime: null, totalSeconds: 900 }
                    }
                };
                
                // New format data
                const newFormatData = [
                    {
                        id: "entry_1755526083180_x0kwqt77v",
                        title: "Agent retraining",
                        totalSeconds: 2975,
                        isRunning: false,
                        startTime: null,
                        endTime: 1755529058583,
                        createdAt: 1755526083180
                    },
                    {
                        id: "entry_1755530000000_abc123",
                        title: "Documentation review",
                        totalSeconds: 1200,
                        isRunning: false,
                        startTime: null,
                        endTime: 1755531200000,
                        createdAt: 1755530000000
                    }
                ];
                
                // Store both formats
                await SecureStorage.setItem(`offPlatform_${testDate}`, JSON.stringify(oldFormatData));
                await SecureStorage.setItem(`offPlatform_entries_${testDate}`, JSON.stringify(newFormatData));
                
                // Also add some note data
                const noteData = {
                    "1": {
                        discussion: "Test note content",
                        startTimestamp: Date.now(),
                        endTimestamp: Date.now() + 60000,
                        completed: true,
                        seconds: 60
                    }
                };
                await SecureStorage.setItem(testDate, JSON.stringify(noteData));
                
                log('setupResult', '✓ Created old format data: offPlatform_2025-08-18', 'success');
                log('setupResult', '✓ Created new format data: offPlatform_entries_2025-08-18', 'success');
                log('setupResult', '✓ Created note data: 2025-08-18', 'success');
                
                await showStorageStatus();
            } catch (error) {
                log('setupResult', `Error: ${error.message}`, 'error');
            }
        };
        
        window.testExport = async function() {
            const result = document.getElementById('exportResult');
            result.textContent = '';
            
            try {
                log('exportResult', 'Starting export...', 'info');
                
                const exportResult = await ImportExportService.exportData();
                
                if (exportResult.success) {
                    log('exportResult', `✓ Export successful: ${exportResult.filename}`, 'success');
                    log('exportResult', `✓ Keys exported: ${exportResult.keysExported}`, 'success');
                    
                    // Check what was actually exported
                    const allData = await SecureStorage.exportAll();
                    let oldFormatCount = 0;
                    let newFormatCount = 0;
                    
                    for (const key of Object.keys(allData)) {
                        if (key.startsWith('offPlatform_entries_')) {
                            newFormatCount++;
                        } else if (key.startsWith('offPlatform_')) {
                            oldFormatCount++;
                        }
                    }
                    
                    log('exportResult', `Storage contains: ${oldFormatCount} old format, ${newFormatCount} new format`, 'info');
                    log('exportResult', 'Export should only include new format entries', 'info');
                } else {
                    log('exportResult', `Export failed: ${exportResult.error}`, 'error');
                }
            } catch (error) {
                log('exportResult', `Error: ${error.message}`, 'error');
            }
        };
        
        window.testImport = async function() {
            const result = document.getElementById('importResult');
            result.textContent = '';
            
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                log('importResult', 'Please select a file to import', 'error');
                return;
            }
            
            try {
                log('importResult', 'Starting import...', 'info');
                
                const importResult = await ImportExportService.importData(file);
                
                if (importResult.success) {
                    log('importResult', `✓ Import successful from: ${importResult.filename}`, 'success');
                    log('importResult', `✓ Keys imported: ${importResult.keysImported}`, 'success');
                    log('importResult', `✓ Export date: ${importResult.exportDate}`, 'success');
                    
                    // Check what was imported
                    const allData = await SecureStorage.exportAll();
                    let oldFormatCount = 0;
                    let newFormatCount = 0;
                    
                    for (const key of Object.keys(allData)) {
                        if (key.startsWith('offPlatform_entries_')) {
                            newFormatCount++;
                        } else if (key.startsWith('offPlatform_')) {
                            oldFormatCount++;
                        }
                    }
                    
                    log('importResult', `After import: ${oldFormatCount} old format, ${newFormatCount} new format`, 'info');
                    log('importResult', 'Old format should be converted to new format', 'info');
                    
                    await showStorageStatus();
                } else {
                    log('importResult', `Import failed: ${importResult.error}`, 'error');
                }
            } catch (error) {
                log('importResult', `Error: ${error.message}`, 'error');
            }
        };
        
        window.clearAllData = async function() {
            const result = document.getElementById('setupResult');
            result.textContent = '';
            
            try {
                SecureStorage.clear();
                log('setupResult', '✓ All data cleared', 'success');
                await showStorageStatus();
            } catch (error) {
                log('setupResult', `Error: ${error.message}`, 'error');
            }
        };
        
        window.showStorageStatus = async function() {
            const status = document.getElementById('storageStatus');
            status.textContent = '';
            
            try {
                const stats = await ImportExportService.getDataStats();
                const allData = await SecureStorage.exportAll();
                
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(stats, null, 2);
                status.appendChild(pre);
                
                // Show specific off-platform keys
                const offPlatformKeys = Object.keys(allData).filter(k => k.includes('offPlatform'));
                if (offPlatformKeys.length > 0) {
                    const h3 = document.createElement('h3');
                    h3.textContent = 'Off-Platform Keys:';
                    status.appendChild(h3);
                    for (const key of offPlatformKeys) {
                        const value = allData[key];
                        const preview = JSON.stringify(value).substring(0, 100) + '...';
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'info';
                        infoDiv.textContent = `${key}: ${preview}`;
                        status.appendChild(infoDiv);
                    }
                }
            } catch (error) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = `Error: ${error.message}`;
                status.appendChild(errorDiv);
            }
        };
        
        // Show initial status
        await showStorageStatus();
    </script>
</body>
</html>
